<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>隐私政策</title>
<style>
  body { margin: 0; padding: 16px 18px 40px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 1.75; color: #333; background: #fff; }
  h1 { font-size: 18px; margin: 8px 0 16px; color: #111; }
  h2 { font-size: 16px; margin: 20px 0 8px; color: #111; }
  p { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 20px; }
  li { margin: 4px 0; }
  .muted { color: #888; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background: #151C24; color: #D8DEE6; } h1, h2 { color: #F0F3F6; } .muted { color: #8A94A0; } }
</style>
</head>
<body>
<h1>隐私政策</h1>
<p class="muted">更新日期：2026 年 11 月 15 日</p>
<h2>一、数据存储</h2>
<p>本应用的账单、账户、分类、标签、预算等数据全部存储在用户设备的本地数据库中（Room/SQLite）。应用不申请网络权限，不上传任何数据。</p>
<h2>二、权限使用</h2>
<ul>
<li>通知权限：周期记账到期提醒。</li>
<li>悬浮窗权限（可选）：支付后记账提醒。</li>
<li>无障碍服务（可选）：识别支付页面文字用于自动记账。</li>
</ul>
<p>以上权限均可拒绝，拒绝后对应功能不可用，其余功能不受影响。</p>
<h2>三、数据共享</h2>
<p>本应用不向任何第三方共享、转让或公开披露用户数据。</p>
<h2>四、数据删除</h2>
<p>用户可在应用内删除账单与账户，或卸载应用清除全部本地数据。</p>
</body>
</html>
