<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>第三方共享个人信息清单</title>
<style>
  body { margin: 0; padding: 16px 18px 40px; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; font-size: 15px; line-height: 1.75; color: #333; background: #fff; }
  h1 { font-size: 18px; margin: 8px 0 16px; color: #111; }
  h2 { font-size: 16px; margin: 20px 0 8px; color: #111; }
  p { margin: 8px 0; }
  ul { margin: 8px 0; padding-left: 20px; }
  li { margin: 4px 0; }
  .muted { color: #888; font-size: 13px; }
  @media (prefers-color-scheme: dark) { body { background: #151C24; color: #D8DEE6; } h1, h2 { color: #F0F3F6; } .muted { color: #8A94A0; } }
</style>
</head>
<body>
<h1>第三方共享个人信息清单</h1>
<p>本应用不接入广告、统计、推送等第三方 SDK，不向第三方共享个人信息。</p>
<h2>本地依赖的开源库</h2>
<ul>
<li>AndroidX 与 Jetpack Compose：界面与状态管理。</li>
<li>Room：本地数据库。</li>
<li>MPAndroidChart：统计图表绘制。</li>
<li>AndroidX AppCompat 与 Material Components：原生控件与主题。</li>
<li>commons-csv、jxl：导入导出表格。</li>
</ul>
<p>以上开源库均在本机运行，不收集或上传用户数据。</p>
</body>
</html>
